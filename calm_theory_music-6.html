<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Calm Theory Music</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Arial,sans-serif;background:#faf9f5;color:#292a2b;
  user-select:none;
}
.app{height:100dvh;display:flex;flex-direction:column;padding:10px 12px 7px;gap:8px}
.top{height:54px;display:flex;align-items:center;justify-content:space-between}
.help,.theme{
  width:44px;height:44px;border:1px solid #dddcd7;border-radius:50%;
  background:#fff;color:#666;font-size:22px;display:grid;place-items:center
}
.title{text-align:center}
.title b{display:block;font:24px Georgia,serif;letter-spacing:2px;color:#50515a}
.title span{font-size:11px;color:#aaa;letter-spacing:2px}
.toggle{width:52px;height:30px;border-radius:20px;background:#555;position:relative}
.toggle i{position:absolute;width:24px;height:24px;right:3px;top:3px;background:#fff;border-radius:50%}

.board{
  position:relative;flex:1;min-height:260px;border:1px solid #d8d7d2;
  border-radius:18px;overflow:hidden;background-color:#fff;
  background-image:
   linear-gradient(#e9e8e3 1px,transparent 1px),
   linear-gradient(90deg,#e9e8e3 1px,transparent 1px),
   linear-gradient(#d7d5cf 1px,transparent 1px),
   linear-gradient(90deg,#d7d5cf 1px,transparent 1px);
  background-size:14px 14px,14px 14px,70px 70px,70px 70px;
}
#draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.playhead{
  position:absolute;top:0;bottom:0;width:2px;background:#5a5b61;
  left:50%;opacity:.8;pointer-events:none;box-shadow:0 0 4px #aaa
}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 color:#aaa;font-size:13px;pointer-events:none;text-align:center}
.notePop{position:absolute;pointer-events:none;font-weight:bold;font-size:12px;
 color:#666;opacity:0;transform:translate(-50%,-10px)}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:nowrap}
.btn{
 width:48px;height:48px;border:1px solid #dddcd7;background:#fff;border-radius:50%;
 display:grid;place-items:center;font-size:20px;color:#333
}
.btn.active{background:#252525;color:#fff}
.record{border:2px solid #e8a99d;color:#d87868}
.record.active{background:#d87868;color:white}
.bpm{margin-left:auto;height:48px;border:1px solid #d8d7d2;border-radius:14px;
 background:#fff;display:flex;align-items:center;padding:0 9px;gap:10px}
.bpm button{border:0;background:none;font-size:23px;color:#555}
#bpm{font-size:20px;min-width:42px;text-align:center}
.colors{display:flex;justify-content:flex-start;align-items:center;gap:12px;padding:4px 8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x}.colors::-webkit-scrollbar{display:none}
.dot{width:31px;height:31px;min-width:31px;border-radius:50%;border:0;flex:0 0 auto}
.dot.sel{outline:2px solid #888;outline-offset:3px}
.keyboard{
 height:58px;border:1px solid #d8d7d2;border-radius:14px;background:#fff;
 position:relative;overflow:hidden;display:flex
}
.key{height:100%;flex:1;border-right:1px solid #cfcfc8;background:#fff;position:relative;cursor:pointer;touch-action:none}.key:active{background:#eee}.key span{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:9px;color:#999}
.key.black{position:absolute;z-index:2;width:9%;height:62%;background:#2d2d2d;
 border-radius:0 0 4px 4px;top:0}
.tools{display:flex;gap:9px;align-items:center}
.small{width:45px;height:45px;border:1px solid #dddcd7;border-radius:50%;
background:#fff;font-size:18px}
.bottomrow{display:flex;align-items:center;justify-content:space-between}
.footer{text-align:center;color:#aaa;font-size:11px;padding-top:2px}
@media(max-height:700px){
 .top{height:45px}.help,.theme{width:38px;height:38px}
 .board{min-height:220px}.btn{width:43px;height:43px}.small{width:40px;height:40px}
 .colors{gap:5px}.dot{width:27px;height:27px}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="help" onclick="showHelp()">?</button>
    <div class="title"><b>— Calm Melody —</b><span>DRAW • PLAY • FEEL</span></div>
    <button class="theme" onclick="document.body.classList.toggle('dark')">☾</button>
  </div>

  <div class="board" id="board">
    <canvas id="draw"></canvas>
    <div class="playhead" id="playhead"></div>
    <div class="hint" id="hint">Gores sebuah garis<br>dan biarkan nada mengalir ♪</div>
  </div>

  <div class="controls">
    <button class="btn" id="play" onclick="togglePlay()">▶</button>
    <button class="btn active" id="brush" onclick="setTool('brush')">⌁</button>
    <button class="btn" onclick="setTool('erase')">⌫</button>
    <button class="btn" onclick="undo()">↶</button>
    <button class="btn" onclick="shuffleNotes()">⤨</button>
    <button class="btn record" id="record" onclick="toggleRecord()">●</button>
    <div class="bpm">
      <button onclick="changeBpm(-5)">−</button>
      <span id="bpm">90</span>
      <button onclick="changeBpm(5)">+</button>
    </div>
    <div class="bpm" style="margin-left:0">
      <span style="font-size:12px;color:#777">VOL</span>
      <input id="vol" type="range" min="0.1" max="1" step="0.05" value="0.75"
             style="width:72px;accent-color:#777">
    </div>
  </div>

  <div class="colors" id="colors">
    <button class="dot sel" style="background:#28a27a" data-c="#28a27a"></button>
    <button class="dot" style="background:#dc5834" data-c="#dc5834"></button>
    <button class="dot" style="background:#7565d5" data-c="#7565d5"></button>
    <button class="dot" style="background:#ee921d" data-c="#ee921d"></button>
    <button class="dot" style="background:#3857ba" data-c="#3857ba"></button>
    <button class="dot" style="background:#ce68a2" data-c="#ce68a2"></button>
    <button class="dot" style="background:#72acd5" data-c="#72acd5"></button>
    <button class="dot" style="background:#292a2b" data-c="#292a2b"></button>
    <button class="dot" style="background:#f1b36d" data-c="#f1b36d"></button>
    <button class="dot" style="background:#ef6f8f" data-c="#ef6f8f"></button>
    <button class="dot" style="background:#35a7a0" data-c="#35a7a0"></button>
    <button class="dot" style="background:#8a6fbd" data-c="#8a6fbd"></button>
    <button class="dot" style="background:#e0b84f" data-c="#e0b84f"></button>
    <button class="dot" style="background:#6f9b55" data-c="#6f9b55"></button>
    <button class="dot" style="background:#d26b3f" data-c="#d26b3f"></button>
  </div>

  <div class="bottomrow">
    <div class="keyboard" id="keyboard"></div>
    <div class="tools">
      <button class="small" onclick="octave(-1)">▲</button>
      <button class="small" onclick="octave(1)">▼</button>
      <button class="small" onclick="wave()">〰</button>
      <button class="small" onclick="setWave('sine')">♬</button>
      <button class="small" onclick="clearBoard()">Ⅱ</button>
    </div>
  </div>

  <div class="bottomrow">
    <div class="tools">
      <button class="small active" id="layer1">1</button>
      <button class="small" id="layer2" onclick="selectLayer(1)">2</button>
      <button class="small" id="layer3" onclick="selectLayer(2)">3</button>
    </div>
    <div class="tools">
      <button class="small" onclick="setLength(1)">•</button>
      <button class="small" onclick="setLength(2)">••</button>
      <button class="small" onclick="setLength(3)">•••</button>
      <button class="small" onclick="saveMelody()">☁</button>
    </div>
  </div>

  <div class="footer">© 2026 • Calm Theory</div>
</div>

<script>
const canvas=document.getElementById('draw'),ctx=canvas.getContext('2d');
const board=document.getElementById('board'),hint=document.getElementById('hint');
const playhead=document.getElementById('playhead');
let W,H,dpr=1, strokes=[], drawing=false, current=null;
let color='#28a27a', tool='brush', bpm=90, octaveShift=0, waveType='sine';
let layer=0, noteLength=1, playing=false, recording=false, audio=null;

const scale=[
  ['C',261.63],['D',293.66],['E',329.63],['G',392.00],
  ['A',440.00],['C5',523.25],['D5',587.33],['E5',659.25],
  ['G5',783.99],['A5',880.00]
];

function resize(){
  const r=board.getBoundingClientRect(); dpr=devicePixelRatio||1;
  W=r.width; H=r.height; canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
addEventListener('resize',resize); resize();

function pos(e){
 const r=canvas.getBoundingClientRect();
 return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function noteAt(y){
 let i=Math.round((1-y/H)*(scale.length-1));
 i=Math.max(0,Math.min(scale.length-1,i));
 const base=scale[i][1];
 return {name:scale[i][0],freq:base*Math.pow(2,octaveShift)};
}
function startAudio(){
 if(!audio) audio=new (AudioContext||webkitAudioContext)();
 if(audio.state==='suspended')audio.resume();
}
function tone(freq,d=.72){
  startAudio();
  if(!audio || audio.state === 'suspended') audio.resume();

  // Audio only: warm, calm and clearly audible. UI/design unchanged.
  const t=audio.currentTime;
  const vol=document.getElementById('vol') ? Number(document.getElementById('vol').value) : .75;
  const master=audio.createGain();
  const filter=audio.createBiquadFilter();
  const body=audio.createBiquadFilter();

  // Soft top end so the note feels relaxing instead of sharp.
  filter.type='lowpass';
  filter.frequency.setValueAtTime(1750,t);
  filter.frequency.exponentialRampToValueAtTime(1050,t+Math.min(d*.85,.65));
  filter.Q.value=.38;

  body.type='peaking';
  body.frequency.value=430;
  body.Q.value=.65;
  body.gain.value=1.8;

  // Louder overall, but with a gentle envelope so it stays smooth.
  const peak=.34*vol;
  master.gain.setValueAtTime(.0001,t);
  master.gain.exponentialRampToValueAtTime(peak,t+.025);
  master.gain.exponentialRampToValueAtTime(peak*.62,t+Math.min(.20,d*.32));
  master.gain.exponentialRampToValueAtTime(.0001,t+d);

  master.connect(filter);
  filter.connect(body);
  body.connect(audio.destination);

  // Simple warm timbre: fundamental + very quiet harmonic + soft low body.
  const parts=[
    ['sine',freq,1],
    ['triangle',freq*2,.045],
    ['sine',freq*.5,.018]
  ];

  for(const [type,f,gain] of parts){
    const o=audio.createOscillator();
    const g=audio.createGain();
    o.type=type;
    o.frequency.setValueAtTime(f,t);
    g.gain.value=gain;
    o.connect(g); g.connect(master);
    o.start(t);
    o.stop(t+d+.05);
  }

  // Prevent old audio nodes from accumulating after many notes.
  setTimeout(()=>{
    try{ master.disconnect(); filter.disconnect(); body.disconnect(); }catch(e){}
  },Math.ceil((d+.2)*1000));
}
function draw(){
 ctx.clearRect(0,0,W,H);
 strokes.forEach(s=>{
  if(!s.points.length)return;
  ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
  for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);
  ctx.strokeStyle=s.color;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
 });
 hint.style.display=strokes.length?'none':'block';
}
canvas.addEventListener('pointerdown',e=>{
 startAudio();drawing=true;canvas.setPointerCapture(e.pointerId);
 const p=pos(e); current={points:[p],color}; strokes.push(current);
 tone(noteAt(p.y).freq,.3);draw();
});
canvas.addEventListener('pointermove',e=>{
 if(!drawing)return;
 const p=pos(e),last=current.points[current.points.length-1];
 if(Math.hypot(p.x-last.x,p.y-last.y)>5){
  if(tool==='erase'){
   const near=strokes.findIndex(s=>s.points.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<18));
   if(near>=0)strokes.splice(near,1);
  }else{
   current.points.push(p);
   if(current.points.length%3===0)tone(noteAt(p.y).freq,.18);
  }
  draw();
 }
});
['pointerup','pointercancel'].forEach(x=>canvas.addEventListener(x,()=>{drawing=false;current=null}));

function setTool(t){tool=t;document.getElementById('brush').classList.toggle('active',t==='brush')}
function undo(){strokes.pop();draw()}
function clearBoard(){strokes=[];playing=false;playhead.style.left='50%';draw()}
function changeBpm(n){bpm=Math.max(40,Math.min(180,bpm+n));document.getElementById('bpm').textContent=bpm}
function octave(n){octaveShift=Math.max(-2,Math.min(2,octaveShift+n))}
function wave(){waveType=waveType==='sine'?'triangle':waveType==='triangle'?'sine':'sine'}
function setWave(w){waveType=w}
function setLength(n){noteLength=n}
function selectLayer(n){layer=n;['layer1','layer2','layer3'].forEach((id,i)=>document.getElementById(id).classList.toggle('active',i===n))}
function shuffleNotes(){
 strokes.sort(()=>Math.random()-.5); draw();
}
function toggleRecord(){recording=!recording;document.getElementById('record').classList.toggle('active',recording)}
function togglePlay(){playing=!playing;document.getElementById('play').textContent=playing?'■':'▶';if(playing)playSong()}
async function playSong(){
 if(!strokes.length){playing=false;document.getElementById('play').textContent='▶';return}
 startAudio();
 const beat=60000/bpm;
 // Semua garis dimainkan berdasarkan posisi X yang sama,
 // jadi nada dari beberapa garis bisa berbunyi BERSAMA.
 const events=[];
 for(const s of strokes){
  if(!s.points.length) continue;
  const step=Math.max(1,Math.floor(s.points.length/8));
  for(let i=0;i<s.points.length;i+=step){
   const p=s.points[i];
   events.push({x:p.x,y:p.y});
  }
  // Pastikan ujung garis ikut dimainkan.
  const last=s.points[s.points.length-1];
  if(last && (events.length===0 || events[events.length-1].x!==last.x || events[events.length-1].y!==last.y)){
   events.push({x:last.x,y:last.y});
  }
 }
 if(!events.length){playing=false;document.getElementById('play').textContent='▶';return}
 events.sort((a,b)=>a.x-b.x);
 const minX=events[0].x, maxX=Math.max(minX+1,events[events.length-1].x);
 const duration=Math.max(900,beat*4);
 let start=performance.now();
 let lastTime=-1;
 for(const e of events){
  if(!playing) break;
  const target=(e.x-minX)/(maxX-minX)*duration;
  const wait=target-lastTime;
  if(wait>0) await new Promise(r=>setTimeout(r,wait));
  if(!playing) break;
  playhead.style.left=(e.x/W*100)+'%';
  tone(noteAt(e.y).freq,Math.min(.55,Math.max(.24,beat/1000*.75)));
  lastTime=target;
 }
 if(playing){
  const elapsed=performance.now()-start;
  await new Promise(r=>setTimeout(r,Math.max(80,duration-elapsed)));
 }
 playing=false;
 document.getElementById('play').textContent='▶';
 playhead.style.left='50%';
}
document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{
 color=d.dataset.c;document.querySelectorAll('.dot').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');
});
function showHelp(){alert('Gores dari kiri ke kanan untuk membuat melodi. Semakin ke atas nadanya semakin tinggi. Gunakan garis pendek untuk nada lembut dan garis panjang untuk rangkaian nada. Tekan PLAY untuk mendengarkan kembali.')}
function saveMelody(){
 const data=JSON.stringify(strokes);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
 a.download='calm-melody.json';a.click();
}
const miniKeys=[['C',261.63],['D',293.66],['E',329.63],['F',349.23],['G',392],['A',440],['B',493.88],['C5',523.25]];
miniKeys.forEach(([name,f])=>{const k=document.createElement('button');k.className='key';k.type='button';k.innerHTML='<span>'+name+'</span>';k.addEventListener('pointerdown',()=>{startAudio();tone(f*Math.pow(2,octaveShift),.9)});document.getElementById('keyboard').appendChild(k)});
</script>
</body>
</html>
